<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>나우즈 사용설명서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{
  color-scheme: light only;   /* 브라우저 강제 다크(force dark) 비활성화 */
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1B2733; --muted:#6B7684;
  --line:#ECEEF2;
  --brand-cyan:#19C3FC; --brand-blue:#1983FC;
  --accent-soft:#E8F6FE; --accent-ink:#0E74C4;
  --sidebar-w:288px; --header-h:56px;
}
*{box-sizing:border-box}
html{color-scheme:light only;background:#FFFFFF}
html,body{margin:0;padding:0;background:#FFFFFF}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* Header — only the menu button is interactive */
.appbar{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:40;
  display:flex;align-items:center;gap:0;padding:0 5.333%;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line)}
.menu-btn{width:24px;height:24px;padding:0;margin-left:16px;border:none;border-radius:6px;background:transparent;
  display:grid;place-items:center;color:var(--ink);flex:0 0 auto;transition:background .15s}
.menu-btn:hover{background:#F1F3F7}
.menu-btn svg{width:24px;height:24px}
.menu-btn .ic-close{display:none}
.menu-btn.is-open .ic-menu{display:none}
.menu-btn.is-open .ic-close{display:block}
.appbar .brand{font-size:16px;font-weight:800;letter-spacing:-.02em;cursor:default;user-select:none}

/* Sidebar (accordion) */
.sidebar{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;z-index:60;
  background:#fff;display:none;overflow-y:auto}
.sidebar.open{display:block}
.sidebar__inner{width:100%;padding:22px 5.333% 60px}

.nav{overflow-y:auto;padding:10px 12px 28px;flex:1 1 auto}
.nav__group{margin-bottom:2px}
.nav__major{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  text-align:left;border:none;background:transparent;
  padding:11px 12px;border-radius:10px;font-size:15px;font-weight:700;color:var(--ink);
  transition:background .12s,color .12s}
.nav__major:hover{background:#F5F7FA}
.nav__major.solo.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav__chev{width:18px;height:18px;flex:0 0 auto;color:#AEB6C0;transition:transform .22s}
.nav__group.expanded>.nav__major .nav__chev{transform:rotate(180deg)}
.nav__sub{overflow:hidden;max-height:0;transition:max-height .26s ease}
.nav__group.expanded>.nav__sub{max-height:640px}
.nav__item{display:block;width:100%;text-align:left;border:none;background:transparent;
  margin-top:1px;padding:9px 12px 9px 24px;border-radius:10px;font-size:14px;font-weight:600;color:#3A4653;
  transition:background .12s,color .12s}
.nav__item:hover{background:#F5F7FA}
.nav__item.active{background:var(--accent-soft);color:var(--accent-ink)}

.overlay{position:fixed;inset:0;background:rgba(20,28,38,.42);opacity:0;visibility:hidden;
  transition:opacity .28s;z-index:50}
.overlay.show{opacity:1;visibility:visible}

/* Content */
main{padding-top:var(--header-h);min-height:100vh}
/* 반응형 콘텐츠 폭 — 화면이 커질수록 설명서 이미지도 함께 커집니다(SVG라 확대해도 선명).
   모바일: 기기 폭 100% / 태블릿·데스크톱: 뷰포트 비례 확장 + 상한 */
.article{width:100%;max-width:420px;margin:0 auto;padding:0}
@media (min-width:640px){ .article{max-width:min(74vw,430px)} }
@media (min-width:1024px){ .article{max-width:min(58vw,510px);padding:12px 0 28px} }
@media (min-width:1600px){ .article{max-width:min(50vw,615px)} }
.screen{display:block;width:100%;height:auto}

@media (min-width:1024px){
  .appbar{padding:0 24px}
  .menu-btn{display:none}
  .sidebar{display:block;right:auto;width:var(--sidebar-w);border-right:1px solid var(--line)}
  .sidebar__inner{padding:14px 14px 40px}
  main{margin-left:var(--sidebar-w)}
}
@media (prefers-reduced-motion:reduce){
  .sidebar,.overlay,.nav__sub,.nav__chev{transition:none}
}

/* ============================================================
   다크 모드 방어 (라이트 모드 강제 고정)
   - 사용자의 OS/브라우저가 다크 모드여도 이 페이지는 항상 라이트로 표시.
   - prefers-color-scheme:dark 가 감지돼도 아래에서 라이트 값을 다시 못박습니다.
   ============================================================ */
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: light only;
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1B2733; --muted:#6B7684;
    --line:#ECEEF2;
    --brand-cyan:#19C3FC; --brand-blue:#1983FC;
    --accent-soft:#E8F6FE; --accent-ink:#0E74C4;
  }
  html, body{ background:#FFFFFF !important; color:#1B2733 !important; }
  .appbar{ background:rgba(255,255,255,.92) !important; border-color:#ECEEF2 !important; }
  .appbar .brand{ color:#1B2733 !important; }
  .sidebar{ background:#FFFFFF !important; border-color:#ECEEF2 !important; }
  .nav__major{ color:#1B2733 !important; }
  .nav__item{ color:#3A4653 !important; }
  .nav__major.solo.active, .nav__item.active{ background:#E8F6FE !important; color:#0E74C4 !important; }
  .article, .sheet, .screen{ background:#FFFFFF !important; }
        }

/* 콘텐츠(화면 이미지) */
.stage{display:block;position:relative}
/* 인터랙티브 브레드크럼 — 대분류/소분류 클릭 시 이동 메뉴 */
.crumbs{position:relative;display:flex;align-items:center;gap:6px;padding:2px 0 8px;margin-left:calc(5.333% - 6px)}
.crumb{display:inline-flex;align-items:center;gap:3px;border:none;background:transparent;padding:3px 6px;border-radius:7px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--accent-ink);background:var(--accent-soft)}
.csep{width:16px;height:16px;flex:0 0 auto;color:#C4CBD4}
.crumbmenu{position:absolute;top:100%;z-index:30;min-width:158px;max-height:290px;overflow-y:auto;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,40,60,.12);padding:6px;
  display:flex;flex-direction:column;gap:2px}
.cmi{border:none;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;
  font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.cmi:hover{background:var(--accent-soft);color:var(--accent-ink)}
.cmi.on{color:var(--accent-ink);font-weight:800}
/* 본문 하단 페이저 — 스크롤 끝에서 노출 (사용자 버튼 디자인 재현, 카테고리 라벨 포함) */
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;padding:0 40px 46px}
.pgbtn{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;
  min-height:60px;min-width:112px;padding:12px 13px;border-radius:8px;
  background:#fff;border:1px solid rgba(107,116,126,.12);color:#353A40;
  letter-spacing:-.01em;cursor:pointer;max-width:46%}
.pgbtn.pg-next{align-items:flex-end;margin-left:auto}
.pgbtn .pg-row{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:600;line-height:16px}
.pgbtn .pg-chev{width:10px;height:12px;flex:0 0 auto}
.pgbtn .pg-cat{font-size:13px;font-weight:600;line-height:13px;color:rgba(32,36,40,.37);
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgbtn .pg-cat:empty{display:none}
/* 화면 내 파란 링크(#479CFD) 클릭 영역 */
.svglink{position:absolute;background:transparent;border:none;padding:0;cursor:pointer;border-radius:4px}
.stage img, .stage svg{display:block;width:100%;height:auto}

/* ============================================================
   헤더 브랜드 버튼 · 검색 버튼
   ============================================================ */
.appbar .brand{border:none;background:transparent;font-size:16px;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);cursor:default;user-select:none;padding:6px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar__spacer{flex:1 1 auto}
.logo-btn{display:inline-flex;align-items:center;flex:0 0 auto;border:none;background:transparent;
  padding:0;margin-right:8px;color:#1E262E;cursor:pointer;transition:opacity .15s}
.logo-btn .logo{height:15px;width:auto;display:block}
.logo-btn:hover{opacity:.72}
.icon-btn{width:24px;height:24px;padding:0;border:none;border-radius:6px;background:transparent;
  display:grid;place-items:center;color:var(--ink);flex:0 0 auto;transition:background .15s}
.icon-btn:hover{background:#F1F3F7}
.icon-btn svg{width:24px;height:24px}

/* ============================================================
   검색 패널
   ============================================================ */
.search-overlay{position:fixed;inset:0;z-index:150;display:none;
  background:rgba(15,20,28,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.search-overlay.open{display:block}
.search-box{position:absolute;top:0;left:0;right:0;margin:0 auto;max-width:600px;
  background:#fff;border-radius:0 0 18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.25);
  padding:14px;max-height:80vh;display:flex;flex-direction:column}
.search-bar{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:48px;flex:0 0 auto}
.search-bar:focus-within{border-color:var(--brand-cyan)}
.search-ico{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
#searchInput{flex:1 1 auto;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--ink);background:transparent}
.search-close{width:34px;height:34px;border:none;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:0 0 auto}
.search-close:hover{background:#F1F3F7}
.search-results{margin-top:8px;overflow-y:auto}
.sresult{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;
  padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.sresult:hover,.sresult.active{background:var(--accent-soft)}
.sresult .maj{font-size:12px;font-weight:700;color:var(--muted)}
.sresult .sep{color:#C4CBD4;font-size:12px}
.sresult .min{font-size:14.5px;font-weight:700;color:var(--ink)}
.sresult:hover .min,.sresult.active .min{color:var(--accent-ink)}
.sresult{flex-wrap:wrap}
.sresult .snip{flex-basis:100%;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sresult .snip b{color:var(--accent-ink);font-weight:800}
.search-empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px}

/* ============================================================
   첫 진입 / 설명서 선택 (랜딩)
   ============================================================ */
.landing{position:fixed;inset:0;z-index:200;display:none;background:#fff;
  overflow:auto;padding:24px}
.landing.open{display:flex;align-items:center;justify-content:center}
.gateway{position:relative;width:min(100%,420px);margin:auto}
.gateway>svg{display:block;width:100%;height:auto}
.gw-hot{position:absolute;left:5.333%;width:89.333%;background:transparent;border:none;padding:0;
  cursor:pointer;border-radius:10px}
.gw-hot.is-disabled{cursor:not-allowed}
/* ============================================================
   다크모드 방어 (검색·랜딩)
   ============================================================ */
@media (prefers-color-scheme: dark){
  .appbar .brand{ color:#1B2733 !important; }
  .logo-btn{ color:#1E262E !important; }
    .icon-btn{ color:#1B2733 !important; }
  .search-box{ background:#FFFFFF !important; }
  #searchInput{ color:#1B2733 !important; }
  .sresult:hover,.sresult.active{ background:#E8F6FE !important; }
  .crumbmenu{ background:#FFFFFF !important; border-color:#ECEEF2 !important; }
  .cmi{ color:#1B2733 !important; }
  .landing{ background:#FFFFFF !important; }
  }
</style>
</head>

  <span class="brand" id="brandBtn">학생앱 사용설명서</span>
  <div class="appbar__spacer"></div>
  <button class="icon-btn" id="searchBtn" aria-label="검색">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="menu-btn" id="menuBtn" aria-label="카테고리 메뉴" aria-controls="sidebar" aria-expanded="false">
    <svg class="ic-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    <svg class="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
</header>

<aside class="sidebar" id="sidebar" aria-label="카테고리">
  <div class="sidebar__inner">
  <nav class="nav" id="nav"></nav>
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<main>
  <div class="article">
    <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
    <div class="stage" id="screen"></div>
    <div class="pager" aria-label="페이지 이동">
      <button class="pgbtn" id="prevBtn" aria-label="이전 페이지">
        <span class="pg-cat" id="prevCat"></span>
        <span class="pg-row"><svg class="pg-chev" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 11L2.5 6L7.5 1"/></svg><span class="pg-word">이전</span></span>
      </button>
      <button class="pgbtn pg-next" id="nextBtn" aria-label="다음 페이지">
        <span class="pg-cat" id="nextCat"></span>
        <span class="pg-row"><span class="pg-word">다음</span><svg class="pg-chev" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 1L7.5 6L2.5 11"/></svg></span>
      </button>
    </div>
  </div>
</main>


<!-- 검색 패널 -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box" role="dialog" aria-modal="true" aria-label="카테고리 검색">
    <div class="search-bar">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

/* 화면 내 링크(#479CFD 텍스트) — 클릭 시 해당 페이지로 이동.
 * 좌표는 화면 이미지 기준 백분율(l,t,w,h), to는 대상 화면 파일명. */
const SCREEN_LINKS = {
  "parent-home-layout.svg": [{"l": 38.933, "t": 79.262, "w": 23.2, "h": 1.511, "to": "parent-start-observation.svg", "label": "관찰일지 보기"}, {"l": 34.4, "t": 89.178, "w": 23.2, "h": 1.511, "to": "parent-start-mode.svg", "label": "모드 설정 보기"}, {"l": 42.133, "t": 94.135, "w": 23.2, "h": 1.511, "to": "parent-start-mode.svg", "label": "모드 설정 보기"}],
  "parent-home-today.svg": [{"l": 39.733, "t": 3.727, "w": 24.267, "h": 1.312, "to": "parent-start-mode.svg", "label": "모드 설정 보기"}],
  "parent-home-benefits.svg": [{"l": 39.733, "t": 1.794, "w": 24.267, "h": 0.641, "to": "parent-start-mode.svg", "label": "모드 설정 보기"}],
  "parent-report-list.svg": [{"l": 70.667, "t": 7.204, "w": 23.2, "h": 1.958, "to": "parent-home-switch.svg", "label": "학생 전환 보기"}]
};

/* 나우즈 사용설명서 뷰어
 * 데이터: pages.js 의 APPS (학생앱/학부모앱)
 * SVG: standalone은 window.SVG_REGISTRY, 멀티파일은 <img src="screens/..">
 */
(function () {
  const $ = (id) => document.getElementById(id);
  const nav=$("nav"), sidebar=$("sidebar"), overlay=$("overlay"), screenEl=$("screen"),
        menuBtn=$("menuBtn"), prevBtn=$("prevBtn"), nextBtn=$("nextBtn"),
        brandBtn=$("brandBtn"), searchBtn=$("searchBtn"),
        searchOverlay=$("searchOverlay"), searchInput=$("searchInput"), searchClose=$("searchClose"),
        searchResults=$("searchResults"), landing=$("landing");

  let activePages = [], currentApp = null, current = 0;
  const isDesktop = () => window.matchMedia("(min-width:1024px)").matches;
  const norm = (s) => (s || "").replace(/\s+/g, "").toLowerCase();

  function inject(el, folder, file) {
    const reg = window.SVG_REGISTRY && window.SVG_REGISTRY[file];
    el.innerHTML = reg ? reg : '<img class="screen" src="' + folder + '/' + file + '" alt="">';
  }

  /* ---------- 앱 선택 / 랜딩 ---------- */
  function showLanding() {
    landing.classList.add("open");
    document.body.style.overflow = "hidden";
    closeSidebar(); closeSearch();
  }
  function selectApp(key) {
    const app = APPS[key];
    if (!app || !app.pages || !app.pages.length) return;  // 준비 안 된 앱
    currentApp = key; activePages = app.pages;
    brandBtn.textContent = app.title;
    document.title = app.title;
    buildNav();
    landing.classList.remove("open");
    document.body.style.overflow = "";
    go(0);
  }
  landing.querySelectorAll(".lcard").forEach(c =>
    c.addEventListener("click", () => { if (!c.classList.contains("is-disabled")) selectApp(c.dataset.app); }));
  const switchBtn = $("switchBtn");
  if (switchBtn) switchBtn.addEventListener("click", showLanding);

  function initLanding() {
    landing.querySelectorAll(".lcard").forEach(c => {
      const app = APPS[c.dataset.app];
      const ready = !!(app && app.pages && app.pages.length);
      c.classList.toggle("is-disabled", !ready);
      c.setAttribute("aria-disabled", ready ? "false" : "true");
      const badge = c.querySelector(".lcard__badge");
      const desc = c.querySelector(".lcard__desc");
      if (badge) badge.style.display = ready ? "none" : "";
      if (desc) desc.textContent = ready ? "사용설명서 보기" : "준비 중입니다";
    });
  }

  /* ---------- 사이드바 ---------- */
  const openSidebar = () => { sidebar.classList.add("open"); menuBtn.classList.add("is-open"); menuBtn.setAttribute("aria-expanded","true"); };
  function closeSidebar(){ sidebar.classList.remove("open"); menuBtn.classList.remove("is-open"); menuBtn.setAttribute("aria-expanded","false"); }
  const toggleSidebar = () => sidebar.classList.contains("open") ? closeSidebar() : openSidebar();

  function buildNav() {
    let i = 0, out = "";
    while (i < activePages.length) {
      const major = activePages[i].major;
      let j = i; const items = [];
      while (j < activePages.length && activePages[j].major === major) { items.push([j, activePages[j].minor]); j++; }
      const solo = items.length === 1 && items[0][1] == null;
      if (solo) {
        out += '<div class="nav__group"><button class="nav__major solo" data-i="' + items[0][0] + '">' + major + '</button></div>';
      } else {
        let subs = "";
        for (const [idx, minor] of items) subs += '<button class="nav__item" data-i="' + idx + '">' + minor + '</button>';
        out += '<div class="nav__group"><button class="nav__major toggle"><span>' + major + '</span>'
             + '<svg class="nav__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
             + '</button><div class="nav__sub">' + subs + '</div></div>';
      }
      i = j;
    }
    nav.innerHTML = out;
    nav.querySelectorAll(".nav__major.toggle").forEach(b =>
      b.addEventListener("click", () => b.parentElement.classList.toggle("expanded")));
    nav.querySelectorAll(".nav__major.solo, .nav__item").forEach(b =>
      b.addEventListener("click", () => { go(+b.dataset.i); closeSidebar(); }));
  }

  /* ---------- 페이지 이동 ---------- */
  function go(n) {
    if (!activePages.length) return;
    current = Math.max(0, Math.min(activePages.length - 1, n));
    const p = activePages[current];
    inject(screenEl, "screens", p.file);
    /* 첫 페이지에서는 이전 버튼, 마지막 페이지에서는 다음 버튼을 아예 제거 */
    prevBtn.style.display = current === 0 ? "none" : "";
    nextBtn.style.display = current === activePages.length - 1 ? "none" : "";
    updatePagerCats();
    renderCrumbs();
    renderScreenLinks();
    nav.querySelectorAll(".nav__item, .nav__major.solo").forEach(b =>
      b.classList.toggle("active", +b.dataset.i === current));
    const act = nav.querySelector(".active[data-i]");
    if (act) { const grp = act.closest(".nav__group"); if (grp) grp.classList.add("expanded"); act.scrollIntoView({ block: "nearest" }); }
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + (current + 1)); } catch (e) {}
  }

  /* ---------- 검색 ---------- */
  function openSearch() {
    if (!activePages.length) return;
    searchOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
    searchInput.value = ""; renderResults(""); searchInput.focus();
  }
  function closeSearch() {
    searchOverlay.classList.remove("open");
    if (!landing.classList.contains("open")) document.body.style.overflow = "";
  }
  const escHtml = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  /* 본문에서 검색어 주변 문맥을 잘라 하이라이트된 스니펫 생성 */
  function contentSnippet(text, q) {
    const chars = q.replace(/\s+/g, "").split("");
    if (!chars.length || !text) return "";
    const re = new RegExp(chars.map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s*"), "i");
    const m = re.exec(text);
    if (!m) return "";
    const s = Math.max(0, m.index - 14), e = Math.min(text.length, m.index + m[0].length + 30);
    return (s > 0 ? "…" : "") + escHtml(text.slice(s, m.index))
         + "<b>" + escHtml(m[0]) + "</b>"
         + escHtml(text.slice(m.index + m[0].length, e)) + (e < text.length ? "…" : "");
  }
  function renderResults(q) {
    const nq = norm(q);
    const matches = [];
    activePages.forEach((p, idx) => {
      const base = { idx, major: p.major, minor: p.minor, snip: "" };
      if (!nq) { matches.push(base); return; }
      const catHay = norm(p.major + (p.minor || ""));
      if (catHay.includes(nq)) { matches.push(base); return; }
      const content = (typeof SEARCH_TEXT !== "undefined" && SEARCH_TEXT[p.file]) || "";
      if (norm(content).includes(nq)) { base.snip = contentSnippet(content, q); matches.push(base); }
    });
    if (!matches.length) { searchResults.innerHTML = '<div class="search-empty">검색 결과가 없어요</div>'; return; }
    searchResults.innerHTML = matches.map(m =>
      '<button class="sresult" data-i="' + m.idx + '">'
      + (m.minor ? '<span class="maj">' + m.major + '</span><span class="sep">›</span><span class="min">' + m.minor + '</span>'
                 : '<span class="min">' + m.major + '</span>')
      + (m.snip ? '<span class="snip">' + m.snip + '</span>' : '')
      + '</button>').join("");
    searchResults.querySelectorAll(".sresult").forEach(b =>
      b.addEventListener("click", () => { go(+b.dataset.i); closeSearch(); }));
  }
  function firstResult(){ return searchResults.querySelector(".sresult"); }

  searchBtn.addEventListener("click", openSearch);
  searchClose.addEventListener("click", closeSearch);
  searchOverlay.addEventListener("click", e => { if (e.target === searchOverlay) closeSearch(); });
  searchInput.addEventListener("input", () => renderResults(searchInput.value));
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { const f = firstResult(); if (f) { go(+f.dataset.i); closeSearch(); } }
  });

  /* ---------- 공통 ---------- */
  menuBtn.addEventListener("click", toggleSidebar);
  overlay.addEventListener("click", closeSidebar);



  /* ---------- 인터랙티브 브레드크럼 ---------- */
  const crumbsEl = $("crumbs");
  const CSEP = '<svg class="csep" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>';
  function closeCrumbMenu() {
    const m = crumbsEl.querySelector(".crumbmenu");
    if (m) m.remove();
  }
  function renderCrumbs() {
    const p = activePages[current];
    if (!p) { crumbsEl.innerHTML = ""; return; }
    let html = '<button class="crumb" data-kind="major">' + p.major + '</button>';
    if (p.minor) html += CSEP + '<button class="crumb" data-kind="minor">' + p.minor + '</button>';
    crumbsEl.innerHTML = html;
  }
  crumbsEl.addEventListener("click", (e) => {
    const item = e.target.closest(".cmi");
    if (item) { const i = +item.dataset.i; closeCrumbMenu(); go(i); return; }
    const btn = e.target.closest(".crumb");
    if (!btn) return;
    const kind = btn.dataset.kind;
    const openMenu = crumbsEl.querySelector(".crumbmenu");
    const wasSame = openMenu && openMenu.dataset.kind === kind;
    closeCrumbMenu();
    if (wasSame) return;
    const p = activePages[current];
    const items = [];
    if (kind === "major") {
      const seen = new Set();
      activePages.forEach((q, i) => {
        if (!seen.has(q.major)) { seen.add(q.major); items.push({ label: q.major, i, on: q.major === p.major }); }
      });
    } else {
      activePages.forEach((q, i) => {
        if (q.major === p.major) items.push({ label: q.minor || q.major, i, on: i === current });
      });
    }
    const menu = document.createElement("div");
    menu.className = "crumbmenu";
    menu.dataset.kind = kind;
    menu.innerHTML = items.map(it =>
      '<button class="cmi' + (it.on ? " on" : "") + '" data-i="' + it.i + '">' + it.label + '</button>').join("");
    menu.style.left = btn.offsetLeft + "px";
    crumbsEl.appendChild(menu);
  });
  document.addEventListener("click", (e) => { if (!crumbsEl.contains(e.target)) closeCrumbMenu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCrumbMenu(); });


  /* ---------- 페이저 카테고리 라벨: 대분류가 바뀌면 대분류, 아니면 소분류 ---------- */
  const prevCat=$("prevCat"), nextCat=$("nextCat");
  function pagerLabel(target, cur) {
    return target.major !== cur.major ? target.major : (target.minor || target.major);
  }
  function updatePagerCats() {
    if (!prevCat || !nextCat) return;
    const cur = activePages[current];
    prevCat.textContent = current > 0 ? pagerLabel(activePages[current - 1], cur) : "";
    nextCat.textContent = current < activePages.length - 1 ? pagerLabel(activePages[current + 1], cur) : "";
  }

  /* ---------- 화면 내 파란 링크(#479CFD) 오버레이 ---------- */
  function renderScreenLinks() {
    screenEl.querySelectorAll(".svglink").forEach(el => el.remove());
    const p = activePages[current];
    const list = (typeof SCREEN_LINKS !== "undefined" && SCREEN_LINKS[p.file]) || [];
    list.forEach(L => {
      const b = document.createElement("button");
      b.className = "svglink";
      b.title = L.label; b.setAttribute("aria-label", L.label + "로 이동");
      b.style.left = L.l + "%"; b.style.top = L.t + "%";
      b.style.width = L.w + "%"; b.style.height = L.h + "%";
      b.addEventListener("click", () => {
        const i = activePages.findIndex(q => q.file === L.to);
        if (i >= 0) go(i);
      });
      screenEl.appendChild(b);
    });
  }



  prevBtn.addEventListener("click", () => go(current - 1));
  nextBtn.addEventListener("click", () => go(current + 1));
  document.addEventListener("keydown", e => {
    if (landing.classList.contains("open")) return;
    if (searchOverlay.classList.contains("open")) { if (e.key === "Escape") closeSearch(); return; }
    if (e.key === "ArrowLeft") go(current - 1);
    else if (e.key === "ArrowRight") go(current + 1);
    else if (e.key === "Escape") { closeSidebar(); }
  });

  /* ---------- 시작: 선택 화면 ---------- */
  initLanding();
  showLanding();
})();
</script>
